<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <!-- in alternate mode the content will bounce back and forth -->
    <marquee behavior="alternate" direction="right" scrollamount="5" scrolldelay="20">Marquee Demo</marquee>  
    <!-- in slide mode the content will slide in from the right and stop at right -->
    <marquee behavior="slide" direction="right" scrollamount="5">Marquee Demo</marquee>
    <!-- in scroll mode the content will scroll from left to right -->
    <marquee behavior="scroll" direction="" scrollamount="5">Marquee Demo</marquee>


    <table border="1" height="500px" width="500px">
        <tr>
            <td style="background-image: url(/image/jk.png); background-size: cover;" ></td>
            <td><marquee behavior="scroll" direction="down" scrolldelay="30" style="text-align: center;">welcome</marquee></td>
            <td style="background-image: url(/image/jk.png); background-size: cover;" ></td>
        </tr>
        <tr>
            <td><marquee behavior="scroll" direction="right" scrolldelay="30" style="text-align: center;">welcome</marquee></td>
            <td style="background-image: url(/image/jk.png); background-size: cover;" ></td>
            <td><marquee behavior="scroll" direction="left" scrolldelay="30" style="text-align: center;">welcome</marquee></td>
        </tr>
        <tr>
            <td style="background-image: url(/image/jk.png); background-size: cover;" ></td>
            <td><marquee behavior="scroll" direction="up" scrolldelay="30" style="text-align: center;">welcome</marquee></td>
            <td style="background-image: url(/image/jk.png); background-size: cover;" ></td>
        </tr>
        </center>
    </table>


    
</body>
</html>
