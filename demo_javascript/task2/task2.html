<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odd or even</title>
</head>
<body>
    <h3>number check</h3>
    <input type="number" id="num">
    <button type="button" onclick="check()">check</button>
    <p id="display"></p>
    
    <script>
        function check(){
            let num=document.getElementById("num").value;
            if(num>0){
                document.getElementById("display").innerHTML="positive number";
            }

            else if(num<0){
                document.getElementById("display").innerText="negative number";
            }

            else if(num==0){
                document.getElementById("display").innerHTML="number is 0";
            }
            
            else{
                document.getElementById("display").innerHTML="number is invalid";
            }
        }
    </script>
</body>
</html>
