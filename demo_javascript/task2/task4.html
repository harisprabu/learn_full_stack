<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calci</title>
</head>
<body>
    <form action="">
        <h3>calci</h3>
        <input type="number" id="num1" placeholder="num 1">
        <input type="number" id="num2" placeholder="num 2">
        <button type="button" onclick="add()">add</button>
        <button type="button" onclick="sub()">subtract</button>
        <button type="button" onclick="multi()">multiply</button>
        <button type="button" onclick="divis()">divide</button>
        <h3 id="display"></h3>
    </form>

    <script>        
        function add(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            c=a+b;
            document.getElementById("display").innerHTML="addition value is:"+c;
        }
        
        function sub(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            c=a-b;
            document.getElementById("display").innerHTML="subtracted value is:"+c;
        }
        
        function multi(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            c=a*b;
            document.getElementById("display").innerHTML="multiplied value is:"+c;
        }
        
        function divis(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            c=a/b;
            document.getElementById("display").innerHTML="divided value is:"+c;
        }


    </script>
</body>
</html>
