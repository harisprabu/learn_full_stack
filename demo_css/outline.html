<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient & Outline</title>
    <style>
        body{
            background: linear-gradient(to top(left, right), rgb(255, 0, 225),rgb(0, 255, 242));
        }
        h1{
            border: 2px solid black;
            height: auto;
            width: 140px;
            border-top-right-radius: 40px;
            padding: 5px;
            margin: 25px;
            outline: 4px solid rgba(255, 0, 0, 0.586);
            color: aliceblue;
            cursor: all-scroll;
        }
    </style>
</head>
<body>
        <h1>Welcome</h1>
</body>
</html>
