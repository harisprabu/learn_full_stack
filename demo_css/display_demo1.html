<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol>li{
            display: inline;
            background-color: aquamarine;
            width: 100px;
        }

        .list>li{
            display: inline-block;
            background-color: blanchedalmond;
            width: 150px;
        }

        
        .fleex>li{
            display: flex;
            background-color: blue;
            height: 100px;
            width: 100px;
        }

        ul>li{
            display: inline-flex;
            background-color: blue;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <ol>
        <li>Jabakumar</li>
        <li>Jayakada</li>
        <li>Puli</li>
        <li>Yanai</li>
        <li>Patient</li>
    </ol>

    <ul class="list">
        <li>Jabakumar</li>
        <li>Jayakada</li>
        <li>Puli</li>
        <li>Yanai</li>
        <li>Patient</li>
    </ul>

    <ul class="fleex">
        <li>Jabakumar</li>
        <li>Jayakada</li>
        <li>Puli</li>
        <li>Yanai</li>
        <li>Patient</li>
    </ul>

    <ul>
        <li>Jabakumar</li>
        <li>Jayakada</li>
        <li>Puli</li>
        <li>Yanai</li>
        <li>Patient</li>
    </ul>
</body>
</html>
