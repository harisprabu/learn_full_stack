<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="message"></h1>
    <button onclick="green()" type="button">online</button>
    <button onclick="red()" type="button">offline</button>

    <script>
        function green(){
            document.getElementById("message").style.cssText="color:green; border: 1px solid black; width: 100px";
            document.getElementById("message").innerHTML="Online";
        }
        
        function red(){
            document.getElementById("message").style.cssText="color:red; border: 1px solid black; width: 100px";
            document.getElementById("message").innerHTML="Offline";
        }
    </script>
</body>
</html>
