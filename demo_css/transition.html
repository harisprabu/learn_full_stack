<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            height: 50px;
            width: 150px;
            font-size: 20px;
            border-radius: 15px;
        }

        .b1{
            border: 2px solid blue;
            color: blue;
            transition: width 1s, height 2s, background-color 2s;
        }

        .b1:hover{
            height: 100px;
            width: 200px;
            color: white;
            background-color: blue;
        }

        .b2{
            border: 2px solid red;
            color: rgb(255, 255, 255);
            background-color: red;
        }
        
        /* .b2:hover{
            border: 2px solid red;
            color: rgb(255, 0, 0);
            background-color: white;
            
        } */
    </style>
</head>
<body>
    <button class="b1">Link Button</button>
    <button class="b2">Link Button</button>
</body>
</html>
