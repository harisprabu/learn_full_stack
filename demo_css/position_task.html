<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position task</title>
    <style>
        .bl{
            background-color: rgb(232, 131, 0);
            height: 200px;
            width: 200px;
            position: relative;
        }

        .ue{
            background-color: aqua;
            height: 100px;
            width: 100px;
            position: absolute;
            top: 45px;
            left: 45px;
        }

        .center{
            position: absolute;
            top: 15px;
        }
    </style>

</head>
<body>
    <div class="bl">
        <div class="ue">
            <div class="center">
                <h2>Welcome</h2>
            </div>
        </div>
    </div>
</body>
</html>
