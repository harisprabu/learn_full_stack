<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            height: 98vh;
            background-color: rgb(249, 238, 224);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login{
            background-color: bisque;
            height: 50vh;
            width: 50%;
            border: 2px solid black;
            border-radius: 30px;
        }

        button{
            height: 35px;
            width: 100px;
            font-size: 18px;
            border-radius: 20px;
            border: 1px solid beige;
            color: white;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login">
            <h1 align="center" style="font-size: 42px;">login page</h1>
            <form action=""></form>
                <table align="center" cellspacing="25px" style="height: 300px; font-size: 25px;"> 
                    <tr>
                        <td><label for="">UserName:</label></td>
                        <td><input type="text" name="" id="" placeholder="username" style="height: 25px; width: 200px;"></td>
                    </tr>
                    <tr>
                        <td><label for="">Password:</label></td>
                        <td><input type="password" name="" id="" placeholder="password" style="height: 25px; width: 200px;"></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center"><button>login</button></td>
                        <!-- <td class="button" colspan="2" align="center"><input type="submit" value="Login" style="height: 25px; width: 70px;"></td> -->
                    </tr>
                    <tr>
                        <td colspan="2" align="center"> <a href="#">forgot password</a></td>
                    </tr>
                </table>
            

        </div>
    </div>
</body>
</html>
