<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sty.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
    
    <style>
        
    </style>
</head>
<body>
    <div class="containers">
        <div class="box">
            <br>
            <br><br><br><br>
            <h1 style="font-size: 40px; color: rgb(129, 73, 1);">Simple Calci</h1> <br>
            <form action="">
            <table>
                <tr>
                    <td><label for="">Maths:</label></td>
                    <td><input type="number" id="maths" placeholder="Enter mark"></td>
                </tr>
                <tr>
                    <td><label for="">English:</label></td>
                    <td><input type="number" id="english" placeholder="Enter mark"></td>
                </tr>
                <tr>
                    <td><label for="">Computer Science:</label></td>
                    <td><input type="number" id="cs" placeholder="Enter mark"></td>
                </tr>
                <tr>
                    <td><label for="">Physics:</label></td>
                    <td><input type="number" id="physics" placeholder="Enter mark"></td>
                </tr>
                <tr>
                    <td><label for="">Chemistry:</label></td>
                    <td><input type="number" id="chemistry" placeholder="Enter mark"></td>
                </tr>
                
                <tr>
                    <td colspan="2" align="center"><button type="button" onclick="totmark()">Total Marks</button></td>
                </tr>
                <tr>
                    <td colspan="2"><h1 id="display"></h1></td>
                </tr>

            </table>
            </form>
        </div>
    </div>

    <script>
        function totmark(){
            let maths=Number(document.getElementById("maths").value);
            let english=Number(document.getElementById("english").value);
            let cs=Number(document.getElementById("cs").value);
            let physics=Number(document.getElementById("physics").value);
            let chemistry=Number(document.getElementById("chemistry").value);
    
            let num=maths+english+cs+physics+chemistry
            let avg=num/5
    
            document.getElementById("display").innerHTML="total mark is:"+num+"<br>"+"average is:"+avg;
        }

    </script>
</body>
</html>
