<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sty.css">
</head>
<body>
    <div class="containers">
        <div class="box">
            <br>
            <br><br><br><br>
            <h1 style="font-size: 40px; color: rgb(129, 73, 1);">SHOPPING</h1> <br>
            <form action="">
            <table>
                <tr>
                    <td><label for="">Amount:</label></td>
                    <td><input type="number" id="amount" placeholder="Enter amount"></td>
                </tr>
                <tr>
                    <td><label for="">User type:</label></td>
                    <td><input type="text" id="premium" placeholder="Enter status"></td>
                </tr>
            
                <tr>
                    <td colspan="2" align="center"><button type="button" onclick="online()">Total Marks</button></td>
                </tr>
                <tr>
                    <td colspan="2"><h1 id="display"></h1></td>
                </tr>

            </table>
            </form>
        </div>
    </div>

    <script>
        function online(){
            let amount=Number(document.getElementById("amount").value);
            let premium=(document.getElementById("premium").value);
            
            if(amount>=2000){
                if(premium=="premium"){

                    let dis=(amount/100)*20
                    document.getElementById("display").innerHTML="Your amount:"+ (amount-dis);
                }
                
                else{
                    let dis=(amount/100)*10

                    document.getElementById("display").innerHTML="Your amount:"+ (amount-dis);
                }
            }
            
            else{
                document.getElementById("display").innerHTML="Your amount:"+amount;
            }
    
        }

    </script>
</body>
</html>
