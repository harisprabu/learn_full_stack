<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sty.css">
</head>
<body>
    <div class="containers">
        <div class="box">
            <br>
            <br><br><br><br>
            <h1 style="font-size: 40px; color: rgb(129, 73, 1);">College Admission</h1> <br>
            <form action="">
            <table>
                <tr>
                    <td><label for="">Percentage:</label></td>
                    <td><input type="number" id="percent" placeholder="Enter %"></td>
                </tr>
                <tr>
                    <td><label for="">Age:</label></td>
                    <td><input type="number" id="age" placeholder="Enter age"></td>
                </tr>
                
                <tr>
                    <td colspan="2" align="center"><button type="button" onclick="totmark()">Total Marks</button></td>
                </tr>
                <tr>
                    <td colspan="2"><h1 id="display"></h1></td>
                </tr>

            </table>
            </form>
        </div>
    </div>

    <script>
        function totmark(){
            let percent=Number(document.getElementById("percent").value);
            let age=Number(document.getElementById("age").value);
            
            if(percent>=60 && percent<=100){
                if(age>=18){
                    document.getElementById("display").innerHTML="Admission Approved !"
                }
                
                else{
                    document.getElementById("display").innerHTML="Age Not Eligible !"
                }
            }
            
            else{
                document.getElementById("display").innerHTML="percent Not Eligible !"
            }
    
        }

    </script>
</body>
</html>
