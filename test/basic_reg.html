<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="">
        <center>
        <table height="500px" width="500px" style="font-family: 'Courier New', Courier, monospace;">
            <tr>
                <td><label for="">Name:</label></td>
                <td><input type="text" placeholder="Enter your name"></td>    
            </tr>
            <tr>
                <td><label for="">Email:</label></td>
                <td><input type="email" placeholder="Enter email"></td>
            </tr>
            <tr>
                <td><label for="">Password:</label></td>
                <td><input type="password" placeholder="Enter password"></td>
            </tr>
            <tr>
                <td><label for="">Age:</label></td>
                <td><input type="number" placeholder="Enter Age"></td>
            </tr>
            <tr>
                <td>
                    <label for="g1">Gender:</label>
                </td>
                <td>
                    <input type="radio" name="g1">Male 
                    <input type="radio" name="g1">Female
                </td>
            </tr>
            <tr>
                <td><label for="">Course:</label></td>
                <td>
                    <select>
                    <option>--Select--</option>
                    <option>Java</option>
                    <option>Pyhon</option>
                    <option>Javascript</option>
                </select>
                </td>
            </tr>
            <tr>
                <td><label for="">Address:</label></td>
                <td><textarea name="address"></textarea></td>
            </tr>
            <tr>
                <td><label for="">DOB:</label></td>
                <td><input type="date" name="" id=""></td>
            </tr>
            <tr>
                <td colspan="2"><input type="checkbox">Terms and Conditons</td>
            </tr>
            <tr>
                <td><input type="submit"></td>
                <td><input type="reset"></td>
            </tr>
        </table>
        
</center>
        

        

        
        
        

        

        



    </form>
</body>
</html>
