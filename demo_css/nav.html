<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation bar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: flex;
            flex-direction: column;
            height: 230vh;
        }

        .nav{
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: row;
            background-color: rgb(255, 255, 255);
        }

        img{
            position: sticky;
            height: 55px;
            width: 55px;
            border-radius: 50%;
            border: 3px solid brown;
        }

        .profile{
            display: flex;
            gap: 15px;
            justify-content: start;
            align-items: center;
            color: brown;
            height: 70px;
        }

        .navi{
            height: 70px;
            display: flex;
            flex-wrap: wrap;
            justify-content: end;
            align-items: center;
            gap: 15px;
            flex: 1;
        }
        
        button{
            height: 30px;
            width: 70px;
            background-color: brown;
            color: wheat;
            border: 1px solid wheat;
            border-radius: 20px;
            transition: 60ms;
        }

        button:hover{
            background: linear-gradient(brown,rgb(251, 197, 99));
            color: rgb(69, 25, 25);
            font-weight: bold;
            cursor: pointer;
        }

        .center{
            display: flex;
            background-image: url(image/cafe_image.jpg);
            height: 40%;
            width: 100%;
            background-size: cover;
            justify-content: center;
            align-items: center;
        }

        .content{
            display: flex;
            flex-direction: column;
            background-color: rgba(240, 248, 255, 0.462);
            position: relative;
            height: 200px;
            width: 50%;
            justify-content: center;
            align-items: center;
        }

        .register{
            display: flex;
            flex-direction: column;
            background-color: wheat;
            height: 40%;
            width: 100%;
            align-items: center;
            justify-content: center;
        }
        .box{
            display: flex;
            flex-direction: column;
            background-color: aliceblue;
            border: 2px solid brown;
            border-radius: 20px;
            height: 55%;
            width: 50%;
            align-items: center;
            justify-content: center;
        }

        footer{
            background-color: ;
            height: 14.5%;
            display: flex;
            flex-direction: column;
        }

        .foot1{
            display: flex;
            flex: 3;
        }

        .split1{
            display: flex;
            flex-direction: column;
            flex: 3;
            margin: 0 30px;
            justify-content: center;
            align-items: center;

        }
        .split2{
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: center;
        }

        .foot2{
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <div class="profile">
                <img src="image/cafe.jpg" alt="">
                <h1>Maharam's Cafe</h1>
            </div>

            <div class="navi">
                <button>home</button>
                <button>about us</button>
                <button>contact</button>
                <button>gallery</button>
            </div>
        </div>

        <section class="center" >
            <div class="content">
                <h1 style="font-size: 50px;">Welcome</h1>
                <p style="font-size: 15px;"> Welcome! to my cafe</p><br>
                <button style="height: 45px; width: 120px; font-size: 20px;">Info</button>
            </div>
        </section>

        <section class="register">
            <div class="box">
                <h1 style="font-size: 40px;">Register Form</h1> <br><br>
                <table height=100px width="300px" class="tables" style="font-size: 20px; font-weight: bold;">
                    <Tr>
                        <td>Name</td>
                        <td><input type="text" style="height: 20px;"></td>
                    </Tr>
                    <Tr>
                        <td>Email</td>
                        <td><input type="email"  style="height: 20px;"></td>
                    </Tr>
                    <Tr>
                        <td>Password</td>
                        <td><input type="password" style="height: 20px;"></td>
                    </table>
                </Tr>
                <br><br><button style="height: 45px; width: 120px; font-size: 20px;">submit</button>
                </div>
        </section>

        <footer>
            <div class="foot1">
                <div class="split1">
                    <h3>Our Services:</h3>
                    <ul>
                        <li>Tea</li>
                        <li>Coffee</li>
                        <li>Black Coffee</li>
                        <li>Green Tea</li>
                        <li>Butter Bun</li>
                        <li>Coconut Bun</li>
                    </ul>
                </div>
                <div class="split2">
                    <button>Home</button>
                    <button>about us</button>
                    <button>Contact</button>
                    <button>Gallery</button>

                </div>

            </div>
            <div class="foot2">
                <p>copyrights @2026</p>
            </div>
        </footer>
    </div>
</body>
</html>
